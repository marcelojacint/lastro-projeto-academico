<h2 mat-dialog-title>{{ dados.titulo }}</h2>

<mat-dialog-content class="conteudo">
  @for (mensagem of dados.mensagens; track $index) {
    <p>{{ mensagem }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false" cdkFocusInitial>Cancelar</button>
  <button mat-flat-button type="button" [mat-dialog-close]="true">{{ dados.confirmar }}</button>
</mat-dialog-actions>
